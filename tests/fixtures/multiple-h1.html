<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three top-level headings on a single page example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h1>First main heading</h1>
  <p>Intro text for the first section of the page.</p>
  <h1>Second main heading</h1>
  <h3>Skipped from level one straight to level three</h3>
  <p>Content under the skipped heading.</p>
  <h2></h2>
  <h1>Third main heading</h1>
</body>
</html>
